name: Supabase keep-alive (aim leaderboard)
# Free Supabase projects pause after a week without traffic; one cheap read per day keeps the leaderboard awake.
# The publishable key is public by design (it is also in aim/js/leaderboard.js); the database only allows reads and the checked submit RPC.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read leaderboard
        run: |
          code=$(curl -s -o /tmp/lb.json -w '%{http_code}' -X POST \
            'https://ffnuweijixvrvjdvjhhu.supabase.co/rest/v1/rpc/get_leaderboard' \
            -H 'apikey: sb_publishable_TbkcthcbEITdVoaNZzmbRg_JlYxO4Nt' \
            -H 'Content-Type: application/json' -d '{"p_limit":1}')
          echo "HTTP $code"; head -c 300 /tmp/lb.json; echo
          test "$code" = 200
