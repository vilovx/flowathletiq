name: CS2 server status

# Polls flowathletiq.dat.gg:25082 over A2S (+ Ranks plugin MySQL leaderboard, + Virsliga every 2 h, + FACEIT tournament registrations) and publishes JSON to the `server-data` branch.
# The branch is force-pushed as a single commit each run, so main's history and Pages builds stay clean.
on:
  schedule:
    - cron: "4-59/5 * * * *" # every 5 min, offset from :00 (high-load minute)
    - cron: "17 */2 * * *" # Virsliga standings/calendar (every 2 h)
  workflow_dispatch:
    inputs:
      leagues:
        description: "Also refresh Kleverr league data"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -q "python-a2s>=1.3" "pymysql>=1.1"
      - name: Restore previous history
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin server-data 2>/dev/null; then
            # keep every previously published file (history, top, virsliga); steps below overwrite what they refresh
            git archive FETCH_HEAD | tar -x -C out
          fi
      - name: Query server
        run: python scripts/server_status.py out
      - name: Export ranks leaderboard (top 100)
        # On failure the previous server-top.json (if any) is kept.
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/server_top.py out
      - name: Virsliga standings + calendar (kleverr.gg)
        if: (github.event_name == 'workflow_dispatch' && inputs.leagues) || github.event.schedule == '17 */2 * * *' || hashFiles('out/virsliga.json') == ''
        continue-on-error: true
        run: python scripts/virsliga.py out
      - name: Kleverr S7 leagues (Virsliga + 1./2./3. liga groups, rosters, calendar)
        # Every 2h with the Virsliga step; team rosters are refetched when older than 20h (or missing).
        if: (github.event_name == 'workflow_dispatch' && inputs.leagues) || github.event.schedule == '17 */2 * * *' || hashFiles('out/leagues.json') == ''
        continue-on-error: true
        run: python scripts/leagues.py out
      - name: FACEIT registered teams (official Data API v4)
        # Skips cleanly when the FACEIT_API_KEY secret or a tournament's faceitChampionshipId (data/tournaments.js) is missing.
        continue-on-error: true
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python scripts/faceit_teams.py out
      - name: Publish to server-data branch
        run: |
          cd out
          git init -q -b server-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "server status $(date -u +%FT%TZ) [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" server-data
